<!DOCTYPE html>
<html>
<head>
    <title>Random Quote Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 min-h-screen text-center pt-10">

    <h1 class="text-3xl font-bold text-blue-700">
        Random Quote Generator
    </h1>

    <p id="quote" class="text-xl bg-white p-5 m-5 rounded">
        Click New Quote
    </p>

    <button id="newQuote"
        class="bg-blue-500 text-white px-4 py-2 rounded">
        New Quote
    </button>

    <button id="copyQuote"
        class="bg-gray-500 text-white px-4 py-2 rounded">
        Copy
    </button>

    <button id="shareQuote"
        class="bg-green-500 text-white px-4 py-2 rounded">
        Share
    </button>


    <script>

        const button = document.getElementById("newQuote");
        const quote = document.getElementById("quote");

        // New Quote
        button.onclick = async function() {

            quote.innerText = "Loading...";

            try {

                const response = await fetch(
                    "https://dummyjson.com/quotes/random"
                );

                const data = await response.json();

                quote.innerText = data.quote;

            } catch (error) {

                quote.innerText = "Something went wrong";

            }
        };


        // Copy
        document.getElementById("copyQuote").onclick = function() {

            navigator.clipboard.writeText(quote.innerText);

            alert("Quote copied!");
        };


        // Share
        document.getElementById("shareQuote").onclick = function() {

            if (navigator.share) {

                navigator.share({
                    title: "Random Quote",
                    text: quote.innerText
                });

            } else {

                alert("Sharing is not supported");

            }
        };

    </script>

</body>
</html>
