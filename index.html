<!DOCTYPE html>
<html>
<head>
    <title>Random Quote Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-sky blue-400 to-tale-500 flex flex-col items-center justify-center">

    <h1 class="text-4xl font-bold text-white">
        Random Quote Generator
    </h1>

    <p id="quote" class="text-white text-xl mt-5">
        Click New Quote
    </p>

    <button id="newQuote" class="bg-white px-5 py-2 rounded-lg mt-5">
        New Quote
    </button>



    <script>
        const button = document.getElementById("newQuote");
        const quote = document.getElementById("quote");

        // New Quote
        button.onclick = async function() {

            quote.innerText = "Loading...";

            try {
                const response = await fetch(
                    "https://dummyjson.com/quotes/random"
                );

                const data = await response.json();

                quote.innerText = data.quote;
            }

            catch (error) {
                quote.innerText = "Something went wrong";
            }
        };


        // Copy Quote
        document.getElementById("copyQuote").onclick = function() {

            navigator.clipboard.writeText(quote.innerText);

            alert("Quote copied!");
        };


        // Share Quote
        document.getElementById("shareQuote").onclick = function() {

            if (navigator.share) {

                navigator.share({
                    title: "Random Quote",
                    text: quote.innerText
                });

            } else {

                // WhatsApp fallback
                const whatsapp =
                    "https://wa.me/?text=" +
                    encodeURIComponent(quote.innerText);

                window.open(whatsapp, "_blank");
            }
        };

    </script>

</body>
</html>
